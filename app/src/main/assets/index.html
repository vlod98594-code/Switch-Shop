<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#eef4fa;color:#14263c;margin:20px}h1{font-size:32px}section{background:white;border-radius:22px;padding:18px;margin:14px 0}input,button{box-sizing:border-box;width:100%;padding:13px;margin:5px 0;border-radius:12px;border:1px solid #ccd8e5;font:inherit}button{background:#205cbd;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Switch Shop</h1><p>Alpha · тестовый магазин</p><section><input id="url" placeholder="https://адрес-сервера"><input id="name" placeholder="Логин"><input id="pw" type="password" placeholder="Пароль"><button onclick="auth('register')">Регистрация</button><button onclick="auth('login')">Войти</button></section><section><h2>Магазин</h2><button onclick="call('/catalog')">Каталог</button><button onclick="call('/balance')">Баланс</button><button onclick="call('/cart/demo','POST')">Добавить тестовый товар</button><button onclick="call('/cart')">Корзина</button><button onclick="call('/checkout','POST')">Купить за тестовые монеты</button><button onclick="call('/orders')">Заказы</button><pre id="out"></pre></section><script>let token='';const el=id=>document.getElementById(id);async function call(path,method='GET',body){try{let base=new URL(el('url').value);if(base.protocol!=='https:')throw Error('Нужен HTTPS');let r=await fetch(base.origin+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let data=await r.json();if(r.ok&&data.token){token=data.token;el('out').textContent='Вход выполнен';}else el('out').textContent=JSON.stringify(data,null,2);return data}catch(e){el('out').textContent=e.message}}function auth(mode){call('/'+mode,'POST',{name:el('name').value,password:el('pw').value})}</script></html>
